name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: valenor
          POSTGRES_PASSWORD: valenor
          POSTGRES_DB: valenor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valenor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://valenor:valenor@localhost:5432/valenor?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-only-secret-not-for-real-use-000000000000
      APP_URL: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run migrations against ephemeral Postgres
        run: npm run db:migrate --workspace=@valenor/db -- --name ci

      - name: Seed
        run: npm run db:seed

      - name: Unit tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
